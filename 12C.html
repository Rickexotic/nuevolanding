<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HP12C V3.2 Side History</title><style>*{box-sizing:border-box}body{margin:0;background:#111;font-family:Segoe UI,Arial,sans-serif;padding:20px}.app-layout{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:1000px;margin:auto}.calc,.panel{background:linear-gradient(#d1b57b,#9c8254);border-radius:24px;padding:16px;box-shadow:0 20px 50px rgba(0,0,0,.45);height:80vh;display:flex;flex-direction:column}.calc{overflow:hidden}.logo{font-size:36px;font-weight:700;flex-shrink:0}.logo span{color:#0057b8}.lcd{flex-shrink:0;height:150px;background:linear-gradient(#e3ebcd,#b6c18d);border:4px solid #666;border-radius:10px;padding:10px;margin:10px 0}.line{text-align:right;font-family:Courier New,monospace;height:25%}.result{font-size:30px;font-weight:bold}.cfg{flex-shrink:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}.cfg input,.cfg select,.tools input{padding:8px;border:none;border-radius:6px;width:100%}.keys{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:6px;margin-top:10px}.keys button{height:auto;min-height:0;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer}.black{background:#222;color:#fff}.blue{background:#0057b8;color:#fff}.orange{background:#c96508;color:#fff}.gray{background:#ddd}.panel{height:80vh;display:flex;flex-direction:column}.tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.tools button{padding:8px;border:none;border-radius:8px;cursor:pointer}.hist{flex:1;overflow-y:auto;background:linear-gradient(#e3ebcd,#b6c18d);border:3px solid #666;border-radius:8px;padding:8px;font-family:Courier New,monospace}.item{padding:6px;border-bottom:1px solid #999}.stats{margin-top:8px;font-weight:bold}@media(max-width:900px){.app-layout{grid-template-columns:1fr}.calc,.panel{height:auto}.panel{min-height:300px}}</style></head><body><div class="app-layout"><div class="calc"><div class="logo">HP <span>12C</span></div><div class="lcd"><div id=l1 class=line>HONORARIOS CHILE</div><div id=l2 class=line>RET 15.25%</div><div id=l3 class=line></div><div id=l4 class='line result'>0</div></div><div class=cfg><select id=tipo><option value=bruto>Bruto → Líquido</option><option value=liquido>Líquido → Bruto</option></select><input id=ret type=number value=15.25 step=0.01></div><div class=keys id=keys></div></div><div class=panel><div class=tools><button id=clearH>Borrar</button><button id=copyH>Copiar</button><button id=csv>CSV</button><input id=search placeholder='Buscar'></div><div id=hist class=hist></div><div id=stats class=stats>Total cálculos: 0</div></div></div><script>let valor='';const $=i=>document.getElementById(i);function upd(){$('l2').textContent='RET '+Number($('ret').value).toFixed(2)+'%';$('l3').textContent=valor?'MONTO '+valor:'';$('l4').textContent=valor||'0'}function add(v){if(v==='.'&&valor.includes('.'))return;valor+=v;upd()}function clr(){valor='';upd()}function bk(){valor=valor.slice(0,-1);upd()}function chs(){if(valor){valor=String(-Number(valor));upd()}}function fmt(n){return Math.round(n).toLocaleString('es-CL')}function save(){try{localStorage.hp32side=$('hist').innerHTML}catch(e){} stats()}function stats(){$('stats').textContent='Total cálculos: '+document.querySelectorAll('.item').length}function calc(){let m=Number(valor);if(!(m>0))return;let t=Number($('ret').value)/100,br,li;if($('tipo').value==='bruto'){br=m;li=br*(1-t);$('l1').textContent='BRUTO → LIQUIDO'}else{li=m;br=li/(1-t);$('l1').textContent='LIQUIDO → BRUTO'}$('l3').textContent='BRUTO '+fmt(br);$('l4').textContent='LIQ '+fmt(li);let div=document.createElement('div');div.className='item';div.textContent=new Date().toLocaleString('es-CL')+' | '+$('l1').textContent+' | BR '+fmt(br)+' | LIQ '+fmt(li);$('hist').prepend(div);save()}const defs=[['CLX','orange',clr],['←','orange',bk],['CHS','blue',chs],['HON','blue',calc],['7','black'],['8','black'],['9','black'],['000','gray'],['4','black'],['5','black'],['6','black'],['.','gray'],['1','black'],['2','black'],['3','black'],['=','blue',calc],['0','black'],['COPY','blue',()=>navigator.clipboard.writeText($('l4').textContent)],['PRINT','blue',()=>window.print()],['ENTER','orange',calc]];defs.forEach(d=>{let b=document.createElement('button');b.textContent=d[0];b.className=d[1];b.onclick=d[2]||(()=>add(d[0]));keys.appendChild(b)});try{if(localStorage.hp32side){$('hist').innerHTML=localStorage.hp32side}}catch(e){} stats();clearH.onclick=()=>{$('hist').innerHTML='';save()};copyH.onclick=()=>navigator.clipboard.writeText($('hist').innerText);csv.onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('hist').innerText]));a.download='historico.csv';a.click()};search.oninput=e=>{let q=e.target.value.toLowerCase();document.querySelectorAll('.item').forEach(x=>x.style.display=x.innerText.toLowerCase().includes(q)?'block':'none')};document.addEventListener('keydown',e=>{if(/^[0-9]$/.test(e.key))add(e.key);else if(e.key==='Enter')calc();else if(e.key==='Backspace'){bk();e.preventDefault()}else if(e.key==='Escape')clr();else if(e.key==='.')add('.')});upd();</script></body></html>
