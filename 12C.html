<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1">

<title>
    HP12C Honorarios Chile
</title>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    padding:20px;

    background:#111;

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;
}

.app-layout{

    display:grid;

    grid-template-columns:
        1fr
        1fr;

    gap:20px;

    max-width:1400px;

    margin:auto;
}

.calc,
.panel{

    background:
        linear-gradient(
            180deg,
            #d9bf86,
            #c0a16a,
            #a98958,
            #927649
        );

    border-radius:24px;

    padding:16px;

    height:80vh;

    display:flex;

    flex-direction:column;

    box-shadow:

        0 40px 80px
        rgba(0,0,0,.60),

        0 12px 24px
        rgba(0,0,0,.35),

        inset 0 2px 2px
        rgba(255,255,255,.25),

        inset 0 -8px 12px
        rgba(0,0,0,.18);
}

.calc{
    overflow:hidden;
}

.logo{

    font-size:36px;

    font-weight:700;

    flex-shrink:0;
}

.logo span{

    color:#0057b8;
}

.lcd{

    flex-shrink:0;

    height:160px;

    margin:12px 0;

    padding:10px;

    border-radius:12px;

    background:
        linear-gradient(
            180deg,
            #edf4db,
            #b5c08a
        );

    border:
        4px solid #676767;

    box-shadow:

        inset 0 7px 14px
        rgba(0,0,0,.35),

        inset 0 -2px 2px
        rgba(255,255,255,.20);
}

.lcd,
.cfg{

    width:100%;
}
    
.line{

    height:25%;

    text-align:right;

    color:#243100;

    font-family:
        "Courier New",
        monospace;
}

.result{

    font-size:30px;

    font-weight:bold;
}

.cfg{

    display:grid;

    grid-template-columns:
        1fr
        1fr;

    gap:8px;

    flex-shrink:0;
}

.cfg input,
.cfg select,
.tools input{

    padding:10px;

    border:none;

    border-radius:12px;

    background:
        linear-gradient(
            #fff,
            #ddd
        );

    box-shadow:

        inset 0 1px 2px rgba(0,0,0,.25),

        0 2px 4px rgba(0,0,0,.15);
}

.keys{

    flex:1;

    min-height:0;

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    grid-auto-rows:1fr;

    gap:8px;

    margin-top:10px;
}

.keys button{

    border:none;

    border-radius:14px;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

    transition:
        transform .08s ease,
        filter .15s ease;
}

.keys button:active{

    transform:
        translateY(2px);
}

.black{

    color:white;

    background:
        linear-gradient(
            180deg,
            #4a4a4a,
            #181818
        );

    box-shadow:

        0 3px 0 #080808,

        0 6px 8px
        rgba(0,0,0,.30);
}

.blue{

    color:white;

    background:
        linear-gradient(
            180deg,
            #1d7de4,
            #004f9c
        );

    box-shadow:

        0 3px 0 #003764,

        0 6px 8px
        rgba(0,0,0,.30);
}

.orange{

    color:white;

    background:
        linear-gradient(
            180deg,
            #f0a04a,
            #bf5c04
        );

    box-shadow:

        0 3px 0 #8a4200,

        0 6px 8px
        rgba(0,0,0,.30);
}

.gray{

    color:#111;

    background:
        linear-gradient(
            180deg,
            #fafafa,
            #d8d8d8
        );

    box-shadow:

        0 3px 0 #9a9a9a,

        0 6px 8px
        rgba(0,0,0,.25);
}

.tools{

    display:flex;

    gap:6px;

    flex-wrap:wrap;

    margin-bottom:8px;
}

.tool-btn{

    border:none;

    border-radius:14px;

    padding:8px 12px;

    cursor:pointer;

    color:white;

    font-weight:bold;

    background:
        linear-gradient(
            180deg,
            #4a4a4a,
            #181818
        );

    box-shadow:

        0 3px 0 #080808,

        0 6px 8px
        rgba(0,0,0,.30);
}

.hist{

    flex:1;

    overflow-y:auto;

    padding:10px;

    border-radius:12px;

    background:
        linear-gradient(
            180deg,
            #edf4db,
            #b5c08a
        );

    border:
        4px solid #676767;

    box-shadow:

        inset 0 7px 14px
        rgba(0,0,0,.35),

        inset 0 -2px 2px
        rgba(255,255,255,.20);

    font-family:
        "Courier New",
        monospace;

    color:#243100;
}

.item{

    position:relative;

    margin-bottom:8px;

    padding:
        10px
        55px
        10px
        10px;

    border-radius:8px;

    background:
        rgba(
            255,
            255,
            255,
            .15
        );
}

.delete-item{

    position:absolute;

    top:8px;

    right:8px;

    border:none;

    background:none;

    cursor:pointer;

    font-family:
        "Courier New",
        monospace;

    font-size:11px;

    font-weight:bold;

    color:#243100;
}

.stats{

    margin-top:8px;

    font-weight:bold;
}

@media(max-width:900px){

    .app-layout{
        grid-template-columns:1fr;
    }

    .calc{
        height:auto;
    }

    .panel{
        height:35vh;
        min-height:280px;
    }

    .hist{
        height:100%;
        overflow-y:auto;
    }

    .cfg{

        grid-template-columns:
            minmax(0,3fr)
            minmax(80px,1fr);

        width:100%;
    }

    .cfg select,
    .cfg input{

        min-width:0;

        width:100%;
    }

    .cfg select{

        font-size:14px;
    }

    .cfg input{

        text-align:right;

        font-size:14px;
    }
}

</style>

</head>

<body>

<div class="app-layout">

<div class="calc">

<div class="logo">
HP <span>12C</span>
</div>

<div class="lcd">

<div id="l1" class="line">
HONORARIOS CHILE
</div>

<div id="l2" class="line">
RET 15.25%
</div>

<div id="l3" class="line">
</div>

<div id="l4" class="line result">
0
</div>

</div>

<div class="cfg">

<select id="tipo">

<option value="bruto">
Bruto → Líquido
</option>

<option value="liquido">
Líquido → Bruto
</option>

</select>

<input
    id="ret"
    type="number"
    value="15.25"
    step="0.01">

</div>

<div
    class="keys"
    id="keys">
</div>

</div>

<div class="panel">

<div class="tools">

<button id="clearH" class="tool-btn">
Borrar
</button>

<button id="copyH" class="tool-btn">
Copiar
</button>

<button id="csv" class="tool-btn">
CSV
</button>

<input
    id="search"
    placeholder="Buscar">

</div>

<div id="hist" class="hist">
</div>

<div id="stats" class="stats">
Total cálculos: 0
</div>

</div>

</div>

<script>

let valor = "";
let resultadoMostrado = false;

const $ = id => document.getElementById(id);

function upd(){

    $("l2").textContent =
        "RET " +
        Number($("ret").value).toFixed(2) +
        "%";

    $("l3").textContent =
        valor
        ? "MONTO " + valor
        : "";

    $("l4").textContent =
        valor || "0";
}

function add(v){

    if(resultadoMostrado){

        valor = "";
        resultadoMostrado = false;
    }

    if(
        v === "." &&
        valor.includes(".")
    ){
        return;
    }

    valor += v;

    upd();
}

function clr(){

    valor = "";
    upd();
}

function bk(){

    valor = valor.slice(0,-1);
    upd();
}

function chs(){

    if(!valor) return;

    valor =
        String(
            Number(valor) * -1
        );

    upd();
}

function fmt(n){

    return Math.round(n)
        .toLocaleString("es-CL");
}

function stats(){

    $("stats").textContent =
        "Total cálculos: " +
        document.querySelectorAll(
            ".item"
        ).length;
}

function save(){

    try{

        localStorage.hp12cHist =
            $("hist").innerHTML;

    }catch(e){}

    stats();
}

function calc(){

    const monto =
        Number(valor);

    if(!(monto > 0)){
        return;
    }

    const tasa =
        Number(
            $("ret").value
        ) / 100;

    let bruto;
    let liquido;

    if(
        $("tipo").value ===
        "bruto"
    ){

        bruto = monto;

        liquido =
            bruto *
            (1 - tasa);

        $("l1").textContent =
            "BRUTO → LIQUIDO";

    }else{

        liquido = monto;

        bruto =
            liquido /
            (1 - tasa);

        $("l1").textContent =
            "LIQUIDO → BRUTO";
    }

    const retMonto =
        bruto - liquido;

    $("l3").textContent =
        "BRUTO " +
        fmt(bruto);

    $("l4").textContent =
        "LIQ " +
        fmt(liquido);

    const div =
        document.createElement(
            "div"
        );

    div.className = "item";

    div.innerHTML = `
        <button
            class="delete-item">
            CLX
        </button>

        <div>
            ${new Date()
                .toLocaleString(
                    "es-CL"
                )}
        </div>

        <div>
            ${$("l1").textContent}
        </div>

        <div>
            BR ${fmt(bruto)}
        </div>

        <div>
            RET TASA ${
                Number(
                    $("ret").value
                ).toFixed(2)
            }%
        </div>

        <div>
            RET MONTO ${
                fmt(retMonto)
            }
        </div>

        <div>
            LIQ ${fmt(liquido)}
        </div>
    `;

    $("hist")
        .prepend(div);

    save();

    resultadoMostrado = true;
}

function printHistory(){

    const win =
        window.open(
            "",
            "_blank",
            "width=900,height=700"
        );

    win.document.write(`
<!DOCTYPE html>
<html>
<head>

<title>
HP12C Historial
</title>

<style>

body{
    margin:20px;
    font-family:
        "Courier New",
        monospace;
}

.report{

    background:
        linear-gradient(
            180deg,
            #edf4db,
            #b5c08a
        );

    border:
        4px solid #676767;

    border-radius:12px;

    padding:15px;

    color:#243100;
}

.item{

    margin-bottom:8px;

    padding:10px;

    border-bottom:
        1px solid #7d8f5f;

    line-height:1.5;
}

.delete-item{
    display:none;
}

</style>

</head>

<body>

<div class="report">

<h2>
HP12C - Historial
</h2>

${$("hist").innerHTML}

</div>

</body>
</html>
    `);

    win.document.close();

    setTimeout(() => {

        win.print();

    }, 300);
}

const defs = [

["CLX","orange",clr],
["←","orange",bk],
["CHS","blue",chs],
["HON","blue",calc],

["7","black"],
["8","black"],
["9","black"],
["000","gray"],

["4","black"],
["5","black"],
["6","black"],
[".","gray"],

["1","black"],
["2","black"],
["3","black"],
["=","blue",calc],

["0","black"],

[
"COPY",
"blue",
() =>
navigator.clipboard.writeText(
    $("l4").textContent
)
],

[
"PRINT",
"blue",
printHistory
],

[
"ENTER",
"orange",
calc
]

];

defs.forEach(d => {

    const b =
        document.createElement(
            "button"
        );

    b.textContent =
        d[0];

    b.className =
        d[1];

    b.onclick =
        d[2] ||
        (() => add(d[0]));

    $("keys")
        .appendChild(b);
});

try{

    if(
        localStorage.hp12cHist
    ){

        $("hist").innerHTML =
            localStorage.hp12cHist;
    }

}catch(e){}

$("hist")
.addEventListener(
    "click",
    function(e){

        if(
            !e.target
            .classList
            .contains(
                "delete-item"
            )
        ){
            return;
        }

        e.target
        .closest(".item")
        .remove();

        save();
    }
);

$("clearH").onclick =
() => {

    $("hist").innerHTML = "";

    save();
};

$("copyH").onclick =
() => {

    navigator.clipboard
    .writeText(
        $("hist").innerText
    );
};

$("csv").onclick =
() => {

    const blob =
        new Blob(
            [$("hist").innerText],
            {
                type:
                "text/plain"
            }
        );

    const a =
        document.createElement(
            "a"
        );

    a.href =
        URL.createObjectURL(
            blob
        );

    a.download =
        "historico.csv";

    a.click();
};

$("search").oninput =
e => {

    const q =
        e.target.value
        .toLowerCase();

    document
    .querySelectorAll(
        ".item"
    )
    .forEach(item => {

        item.style.display =
            item.innerText
            .toLowerCase()
            .includes(q)
            ? "block"
            : "none";
    });
};

document.addEventListener(
    "keydown",
    e => {

        if(
            /^[0-9]$/
            .test(e.key)
        ){
            add(e.key);
        }

        else if(
            e.key === "."
        ){
            add(".");
        }

        else if(
            e.key === "Enter"
        ){
            calc();
        }

        else if(
            e.key ===
            "Backspace"
        ){

            e.preventDefault();

            bk();
        }

        else if(
            e.key ===
            "Escape"
        ){
            clr();
        }
    }
);

stats();
upd();

</script>

</body>
</html>
